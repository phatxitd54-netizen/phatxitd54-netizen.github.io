<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPTV Plyr</title>

<!-- Plyr -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<!-- hls.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Shaka -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<style>
html,body{margin:0;height:100%;background:black;font-family:sans-serif;overflow:hidden}
#plyrBox,#shakaBox{width:100%;height:100%;display:none}
video{width:100%;height:100%;background:black}

.sidebar{
position:absolute;top:0;left:0;height:100%;
width:clamp(300px,32vw,480px);
background:rgba(20,20,20,.97);color:white;
transform:translateX(-100%);transition:.25s;
z-index:999;display:flex;flex-direction:column
}
.sidebar.show{transform:translateX(0)}

.menuBtn{
position:absolute;top:20px;left:20px;z-index:1000;
background:rgba(0,0,0,.6);color:white;
border:none;padding:10px 14px;border-radius:10px;cursor:pointer
}

.searchBox{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.search,.groupSelect{
width:100%;padding:10px;border-radius:10px;border:none;margin-top:6px
}

.channelList{flex:1;overflow-y:auto;padding:10px}
.channel{
display:flex;gap:10px;align-items:center;
padding:10px;border-radius:12px;cursor:pointer
}
.channel:hover{background:#2563eb}
.logo{width:40px;height:40px;object-fit:contain}
.epg{font-size:12px;opacity:.8}
</style>
</head>

<body>

<div id="plyrBox">
  <video id="plyrVideo" playsinline controls></video>
</div>

<div id="shakaBox">
  <video id="shakaVideo" controls></video>
</div>

<button class="menuBtn" onclick="toggleSidebar()">☰</button>

<div id="sidebar" class="sidebar">
  <div class="searchBox">
    <input id="search" class="search" placeholder="Search channel">
    <select id="group" class="groupSelect"></select>
  </div>
  <div id="channelList" class="channelList"></div>
</div>

<script>
/* =========================
GLOBAL
========================= */
let channels=[],epgData={},current=null;
let plyr=null,hls=null,shakaPlayer=null;

const plyrBox=document.getElementById("plyrBox");
const shakaBox=document.getElementById("shakaBox");
const plyrVideo=document.getElementById("plyrVideo");
const shakaVideo=document.getElementById("shakaVideo");
const sidebar=document.getElementById("sidebar");

/* =========================
UI
========================= */
function toggleSidebar(){sidebar.classList.toggle("show")}

/* =========================
EPG (LOCAL)
========================= */
async function loadEPG(){
  const buf = await fetch("https://lichphatsong.site/schedule/epg.xml.gz").then(r=>r.arrayBuffer());
  const xmlText = pako.ungzip(new Uint8Array(buf), {to:"string"});
  const xml = new DOMParser().parseFromString(xmlText,"text/xml");

  xml.querySelectorAll("programme").forEach(p=>{
    const ch=p.getAttribute("channel");
    if(!epgData[ch]) epgData[ch]=[];
    epgData[ch].push({
      title:p.querySelector("title")?.textContent||""
    });
  });
}
function nowEPG(id,name){
  if(epgData[id]) return epgData[id][0]?.title||"";
  for(const k in epgData){
    if(name && k.toLowerCase().includes(name.toLowerCase()))
      return epgData[k][0]?.title||"";
  }
  return "";
}

/* =========================
RENDER
========================= */
function render(list){
  channelList.innerHTML="";
  list.forEach(c=>{
    const d=document.createElement("div");
    d.className="channel";
    d.innerHTML=`
      <img class="logo" src="${c.logo||''}">
      <div>
        <b>${c.name}</b>
        <div class="epg">${nowEPG(c.tvg,c.name)}</div>
      </div>
    `;
    d.onclick=()=>play(c);
    channelList.appendChild(d);
  });
}

function renderGroups(){
  group.innerHTML="<option value=''>All groups</option>";
  [...new Set(channels.map(c=>c.group).filter(Boolean))]
    .forEach(g=>group.innerHTML+=`<option>${g}</option>`);
}

search.oninput=group.onchange=()=>{
  const q=search.value.toLowerCase(),g=group.value;
  render(channels.filter(c=>
    c.name.toLowerCase().includes(q) &&
    (!g||c.group===g)
  ));
};

/* =========================
PLAYER SWITCH
========================= */
async function play(ch){
  current=ch;
  sidebar.classList.remove("show");

  // cleanup
  if(hls){hls.destroy();hls=null}
  if(plyr){plyr.destroy();plyr=null}
  plyrBox.style.display="none";
  shakaBox.style.display="none";

  // DASH DRM → SHAKA
  if(ch.url.includes(".mpd") && ch.kid){
    shakaBox.style.display="block";
    if(!shakaPlayer) shakaPlayer=new shaka.Player(shakaVideo);
    await shakaPlayer.configure({
      drm:{clearKeys:{[ch.kid]:ch.key}}
    });
    await shakaPlayer.load(ch.url);
    shakaVideo.play();
    return;
  }

  // HLS → PLYR
  plyrBox.style.display="block";
  plyr=new Plyr(plyrVideo);

  if(Hls.isSupported()){
    hls=new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(plyrVideo);
  }else{
    plyrVideo.src=ch.url;
  }
  plyr.play();
}

/* =========================
M3U PARSER (BOM SAFE)
========================= */
function parseM3U(txt){
  txt=txt.replace(/^\uFEFF/,"");
  const lines=txt.split(/\r?\n/);
  let c=null,out=[];
  for(let l of lines){
    l=l.trim();
    if(!l) continue;
    if(l.startsWith("#EXTINF")){
      c={};
      c.name=l.split(",").pop();
      c.logo=l.match(/tvg-logo="([^"]+)"/)?.[1];
      c.tvg=l.match(/tvg-id="([^"]+)"/)?.[1];
      c.group=l.match(/group-title="([^"]+)"/)?.[1];
    }else if(l.startsWith("http")&&c){
      c.url=l;out.push(c);c=null;
    }
  }
  return out;
}

/* =========================
BOOT
========================= */
(async()=>{
  await loadEPG();
  const txt=await fetch("https://phatxitd54-netizen.github.io/playlist_clearkey_json_inline.m3u").then(r=>r.text());
  channels=parseM3U(txt);

  if(!channels.length){
    alert("Playlist không có kênh!");
    return;
  }

  renderGroups();
  render(channels);
  play(channels[0]);
})();
</script>

</body>
</html>
