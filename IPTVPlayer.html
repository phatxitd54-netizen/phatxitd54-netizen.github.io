<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MONSTER IPTV 😈📺</title>

<!-- PLYR -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<!-- SHAKA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<!-- HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- PAKO (GZIP) -->
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<style>
html,body{
margin:0;
height:100%;
background:black;
overflow:hidden;
font-family:sans-serif;
}

/* VIDEO */
video{
width:100%;
height:100%;
background:black;
}

/* MENU */
.menuBtn{
position:absolute;
top:20px;
left:20px;
z-index:9999;
background:rgba(0,0,0,.6);
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

/* LOGO */
#appLogo{
position:absolute;
top:20px;
right:20px;
height:48px;
z-index:9999;
opacity:.9;
}

/* SIDEBAR */
.sidebar{
position:absolute;
top:0;
left:0;
height:100%;
width:clamp(280px,28vw,420px);
background:rgba(20,20,20,.96);
backdrop-filter:blur(30px);
transform:translateX(-100%);
transition:.25s;
display:flex;
flex-direction:column;
z-index:999;
}

.sidebar.show{transform:translateX(0);}

.searchBox{padding:14px;border-bottom:1px solid rgba(255,255,255,.05);}
.search{width:100%;padding:12px;border-radius:10px;border:none;outline:none;}

.channelList{flex:1;overflow-y:auto;padding:10px;}

.channel{
display:flex;
align-items:center;
gap:12px;
padding:10px;
border-radius:12px;
cursor:pointer;
color:white;
transition:.15s;
}
.channel:hover{background:#2563eb;transform:scale(1.02);}
.logo{width:42px;height:42px;object-fit:contain;}
.star{margin-left:auto;cursor:pointer;}

/* EPG */
#epgBox{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:min(90%,800px);
max-height:40%;
background:rgba(0,0,0,.75);
color:white;
padding:14px;
border-radius:14px;
overflow:auto;
z-index:9998;
font-size:14px;
display:none;
}
#epgTitle{font-weight:bold;margin-bottom:8px;}
</style>
</head>

<body>

<button class="menuBtn" onclick="toggleSidebar()">☰</button>

<img id="appLogo" src="https://i.imgur.com/8QfQZ6R.png">

<video id="video" playsinline crossorigin></video>

<div id="sidebar" class="sidebar">
  <div class="searchBox">
    <input id="search" class="search" placeholder="Search channel...">
  </div>
  <div id="channelList" class="channelList"></div>
</div>

<div id="epgBox">
  <div id="epgTitle">📅 Lịch phát sóng</div>
  <div id="epgContent">Đang tải EPG…</div>
</div>

<script>
let shakaPlayer,hls,plyr;
let channels=[],currentChannel=null,switching=false;
const video=document.getElementById("video");
const sidebar=document.getElementById("sidebar");

/* PLYR */
plyr=new Plyr(video,{
controls:['play','progress','current-time','mute','volume','settings','fullscreen']
});

/* SIDEBAR */
function toggleSidebar(){sidebar.classList.toggle("show");}

let favorites=JSON.parse(localStorage.getItem("favorites")||"[]");

function renderSidebar(list=channels){
const box=document.getElementById("channelList");
box.innerHTML="";
list.forEach(ch=>{
const div=document.createElement("div");
div.className="channel";
div.innerHTML=`
<img class="logo" src="${ch.logo||''}">
<span>${ch.name}</span>
<div class="star">${favorites.includes(ch.url)?"⭐":"☆"}</div>
`;
div.onclick=()=>{switchChannel(ch);sidebar.classList.remove("show");};
div.querySelector(".star").onclick=e=>{
e.stopPropagation();
favorites.includes(ch.url)
? favorites=favorites.filter(f=>f!==ch.url)
: favorites.push(ch.url);
localStorage.setItem("favorites",JSON.stringify(favorites));
renderSidebar(list);
};
box.appendChild(div);
});
}

search.oninput=e=>{
const q=e.target.value.toLowerCase();
renderSidebar(channels.filter(c=>c.name.toLowerCase().includes(q)));
};

/* DRM */
const norm=k=>k.replace(/-/g,'').toLowerCase();
const base64ToHex=b=>{const r=atob(b);return [...r].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('');};

/* PLAYERS */
async function initShaka(){
if(!shaka.Player.isBrowserSupported())return;
shakaPlayer=new shaka.Player(video);
}

async function destroyPlayers(){
try{if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null;}}catch{}
try{if(hls){hls.destroy();hls=null;}}catch{}
video.removeAttribute("src");video.load();
}

/* SWITCH */
async function switchChannel(ch){
if(switching)return;
switching=true;currentChannel=ch;
await destroyPlayers();

try{
if(ch.url.includes(".mpd")){
await initShaka();
if(ch.kid&&ch.key)
await shakaPlayer.configure({drm:{clearKeys:{[ch.kid]:ch.key}}});
await shakaPlayer.load(ch.url);
plyr.play();showEPG(ch.name);
switching=false;return;
}
if(ch.url.includes(".m3u8")){
if(Hls.isSupported()){
hls=new Hls({lowLatencyMode:true});
hls.loadSource(ch.url);
hls.attachMedia(video);
}else video.src=ch.url;
plyr.play();showEPG(ch.name);
switching=false;return;
}
video.src=ch.url;plyr.play();showEPG(ch.name);
}catch{}
switching=false;
}

/* EPG */
const EPG_URL="https://vnepg.site/epg.xml.gz";
let epgPrograms=[];

async function loadEPG(){
const r=await fetch(EPG_URL);
const gz=new Uint8Array(await r.arrayBuffer());
const xml=pako.ungzip(gz,{to:"string"});
const dom=new DOMParser().parseFromString(xml,"text/xml");
epgPrograms=[...dom.querySelectorAll("programme")].map(p=>({
channel:p.getAttribute("channel"),
start:p.getAttribute("start"),
stop:p.getAttribute("stop"),
title:p.querySelector("title")?.textContent||"",
desc:p.querySelector("desc")?.textContent||""
}));
}

function showEPG(name){
const box=document.getElementById("epgBox");
const content=document.getElementById("epgContent");
const list=epgPrograms.filter(p=>p.channel?.toLowerCase().includes(name.toLowerCase()));
if(!list.length){content.innerHTML="Không có EPG";box.style.display="block";return;}
content.innerHTML=list.slice(0,8).map(p=>`
<div><b>${p.start.slice(8,10)}:${p.start.slice(10,12)} -
${p.stop.slice(8,10)}:${p.stop.slice(10,12)}</b> • ${p.title}</div>
`).join("");
box.style.display="block";
}

document.addEventListener("keydown",e=>{
if(e.key==="e"){
const b=document.getElementById("epgBox");
b.style.display=b.style.display==="block"?"none":"block";
}
});

/* M3U */
function parseM3U(data){
const lines=data.split("\n");
let ch={},out=[];
for(let l of lines){
l=l.trim();
if(l.startsWith("#EXTINF")){
ch={};ch.name=l.split(",").pop();
const m=l.match(/tvg-logo="([^"]+)"/);if(m)ch.logo=m[1];
}else if(l.startsWith("http")){
ch.url=l;out.push(ch);ch={};
}}
return out;
}

/* LOAD */
loadEPG();
fetch("https://raw.githubusercontent.com/huh03482-dotcom/lol/refs/heads/main/playlist_clearkey_json_inline.m3u")
.then(r=>r.text())
.then(t=>{
channels=parseM3U(t);
renderSidebar();
if(channels.length)switchChannel(channels[0]);
});
</script>
</body>
</html>
