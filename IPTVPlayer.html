<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BOSS IPTV 😈📺</title>

<!-- PLYR -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<!-- SHAKA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<!-- HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<style>
html,body{
margin:0;height:100%;
background:black;
font-family:sans-serif;
overflow:hidden;
}

/* VIDEO */
video{width:100%;height:100%;background:black}

/* MENU */
.menuBtn{
position:absolute;top:20px;left:20px;z-index:9999;
background:rgba(0,0,0,.6);
color:white;border:none;
padding:10px 14px;border-radius:10px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
position:absolute;top:0;left:0;height:100%;
width:420px;
background:rgba(20,20,20,.97);
backdrop-filter:blur(25px);
transform:translateX(-100%);
transition:.25s;
display:flex;flex-direction:column;
z-index:999;
}
.sidebar.show{transform:translateX(0)}

.searchBox{padding:12px;border-bottom:1px solid #333}
.search{width:100%;padding:10px;border-radius:8px;border:none}

.groupList{
display:flex;gap:6px;
padding:10px;
overflow-x:auto;
}

.group{
padding:6px 12px;
border-radius:999px;
background:#222;color:white;
cursor:pointer;
white-space:nowrap;
}
.group.active{background:#2563eb}

.channelList{
flex:1;overflow:auto;padding:10px
}

.channel{
padding:10px;border-radius:10px;
cursor:pointer;color:white;
transition:.15s;
}
.channel:hover{background:#2563eb}

.epg{
font-size:12px;opacity:.8;
margin-top:4px;
}
</style>
</head>

<body>

<button class="menuBtn" onclick="toggleSidebar()">☰</button>

<video id="video" playsinline crossorigin></video>

<div id="sidebar" class="sidebar">

<div class="searchBox">
<input id="search" class="search" placeholder="Tìm kênh...">
</div>

<div id="groupList" class="groupList"></div>

<div id="channelList" class="channelList"></div>

</div>

<script>
/* ================= GLOBAL ================= */
let shakaPlayer,hls,plyr;
let channels=[],groups={};
let currentGroup="ALL";
let epgData={};
let currentChannel=null;
let switching=false;

const video=document.getElementById("video");
const sidebar=document.getElementById("sidebar");

/* ================= PLYR ================= */
plyr=new Plyr(video,{
controls:['play','progress','current-time','mute','volume','fullscreen']
});

/* ================= SIDEBAR ================= */
function toggleSidebar(){
sidebar.classList.toggle("show");
}

/* ================= DRM HELPERS ================= */
const norm=x=>x.replace(/-/g,'').toLowerCase();

function base64ToHex(b){
const r=atob(b);let h="";
for(let i=0;i<r.length;i++)
h+=r.charCodeAt(i).toString(16).padStart(2,'0');
return h;
}

function parseClearKeyJSON(j){
try{
const d=JSON.parse(j);
return{
kid:norm(base64ToHex(d.keys[0].kid)),
key:norm(base64ToHex(d.keys[0].k))
};
}catch{return null;}
}

/* ================= PLAYERS ================= */
async function initShaka(){
if(!shaka.Player.isBrowserSupported())return;
shakaPlayer=new shaka.Player(video);
shakaPlayer.addEventListener("error",recover);
}

async function destroyPlayers(){
try{if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null}}catch{}
try{if(hls){hls.destroy();hls=null}}catch{}
video.removeAttribute("src");video.load();
}

/* ================= SMART SWITCH ================= */
async function switchChannel(ch){
if(switching)return;
switching=true;
currentChannel=ch;

await destroyPlayers();

try{
if(ch.url.includes(".mpd")){
await initShaka();
if(ch.kid && ch.key){
await shakaPlayer.configure({
drm:{clearKeys:{[ch.kid]:ch.key}}
});
}
await shakaPlayer.load(ch.url);
plyr.play();
switching=false;return;
}

if(ch.url.includes(".m3u8")){
if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(ch.url);
hls.attachMedia(video);
hls.on(Hls.Events.ERROR,recover);
}else video.src=ch.url;
plyr.play();
switching=false;return;
}

video.src=ch.url;
plyr.play();
}catch{recover()}
switching=false;
}

/* ================= RECOVER ================= */
function recover(){
if(!currentChannel)return;
setTimeout(()=>switchChannel(currentChannel),3000);
}

/* ================= EPG ================= */
function parseEPG(xml){
const dom=new DOMParser().parseFromString(xml,"text/xml");
dom.querySelectorAll("programme").forEach(p=>{
const ch=p.getAttribute("channel");
const start=p.getAttribute("start");
const title=p.querySelector("title")?.textContent;
if(!epgData[ch])epgData[ch]=[];
epgData[ch].push({start,title});
});
}

/* ================= RENDER ================= */
function renderGroups(){
const box=document.getElementById("groupList");
box.innerHTML='<div class="group active" data="ALL">ALL</div>';
Object.keys(groups).forEach(g=>{
box.innerHTML+=`<div class="group" data="${g}">${g}</div>`;
});
box.querySelectorAll(".group").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".group").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
currentGroup=b.getAttribute("data");
renderChannels();
};
});
}

function renderChannels(){
const box=document.getElementById("channelList");
box.innerHTML="";
let list=currentGroup==="ALL"?channels:groups[currentGroup];
list.forEach(ch=>{
const epg=epgData[ch.tvgid]?.[0]?.title||"";
box.innerHTML+=`
<div class="channel" onclick='switchChannel(channels[${channels.indexOf(ch)}])'>
${ch.name}
<div class="epg">${epg}</div>
</div>`;
});
}

search.oninput=e=>{
const q=e.target.value.toLowerCase();
renderChannels(
channels.filter(c=>c.name.toLowerCase().includes(q))
);
};

/* ================= M3U PARSER ================= */
function parseM3U(txt){
const lines=txt.split("\n");
let ch={},out=[];
lines.forEach(l=>{
l=l.trim();
if(l.startsWith("#EXTINF")){
ch={};
ch.name=l.split(",").pop();
const g=l.match(/group-title="([^"]+)"/);
if(g){
ch.group=g[1];
groups[ch.group]=groups[ch.group]||[];
}
const id=l.match(/tvg-id="([^"]+)"/);
if(id)ch.tvgid=id[1];
}
else if(l.includes("license_key=")){
let d=l.split("license_key=")[1];
if(d.startsWith("{")){
const p=parseClearKeyJSON(d);
if(p){ch.kid=p.kid;ch.key=p.key}
}else if(d.includes(":")){
let[kid,key]=d.split(":");
ch.kid=norm(kid);ch.key=norm(key);
}
}
else if(l.startsWith("http")){
ch.url=l;
out.push(ch);
if(ch.group)groups[ch.group].push(ch);
ch={};
}
});
return out;
}

/* ================= LOAD ================= */
fetch("https://raw.githubusercontent.com/huh03482-dotcom/lol/refs/heads/main/playlist_clearkey_json_inline.m3u")
.then(r=>r.text())
.then(t=>{
channels=parseM3U(t);
renderGroups();
renderChannels();
switchChannel(channels[0]);
});

fetch("https://lichphatsong.site/schedule/epg.xml.gz")
.then(res => res.arrayBuffer())
.then(buffer => {

const uint8 =
new Uint8Array(buffer);

/* GUNZIP */
const xmlText =
pako.ungzip(uint8, { to: "string" });

parseEPG(xmlText);

})
.catch(err=>{
console.error("EPG load failed", err);
});

</script>
</body>
  </html>
