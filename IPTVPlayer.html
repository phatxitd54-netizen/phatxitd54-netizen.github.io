<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MONSTER IPTV 😈📺</title>

<!-- PLYR -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<!-- SHAKA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<!-- HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
margin:0;
height:100%;
background:black;
overflow:hidden;
font-family:sans-serif;
}

/* VIDEO */
video{
width:100%;
height:100%;
background:black;
}

/* MENU */
.menuBtn{
position:absolute;
top:20px;
left:20px;
z-index:9999;
background:rgba(0,0,0,.6);
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
position:absolute;
top:0;
left:0;
height:100%;
width:clamp(280px,28vw,420px);
background:rgba(20,20,20,.96);
backdrop-filter:blur(30px);
transform:translateX(-100%);
transition:.25s;
display:flex;
flex-direction:column;
z-index:999;
}
.sidebar.show{transform:translateX(0)}

.searchBox{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.05);
}
.search{
width:100%;
padding:12px;
border-radius:10px;
border:none;
outline:none;
}

.channelList{
flex:1;
overflow-y:auto;
padding:10px;
}

.channel{
display:flex;
align-items:center;
gap:12px;
padding:10px;
border-radius:12px;
cursor:pointer;
color:white;
transition:.15s;
}
.channel:hover{
background:#2563eb;
transform:scale(1.02);
}

/* ===== LOGO ENGINE ===== */

.logoWrap{
width:42px;
height:42px;
border-radius:8px;
background:#111;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
flex-shrink:0;
}

.logo{
width:100%;
height:100%;
object-fit:contain;
opacity:0;
transition:.2s;
}
.logo.loaded{opacity:1}

.logoPlaceholder{
width:100%;
height:100%;
background:linear-gradient(
90deg,#111 25%,#1f1f1f 37%,#111 63%
);
background-size:400% 100%;
animation:shimmer 1.2s infinite;
}

@keyframes shimmer{
0%{background-position:100% 0}
100%{background-position:-100% 0}
}

.star{
margin-left:auto;
cursor:pointer;
}
</style>
</head>

<body>

<button class="menuBtn" onclick="toggleSidebar()">☰</button>

<video id="video" playsinline crossorigin></video>

<div id="sidebar" class="sidebar">
  <div class="searchBox">
    <input id="search" class="search" placeholder="Search channel...">
  </div>
  <div id="channelList" class="channelList"></div>
</div>

<script>
/* =====================
GLOBAL
===================== */
let shakaPlayer;
let hls;
let plyr;
let channels=[];
let currentChannel=null;
let switching=false;

const video=document.getElementById("video");
const sidebar=document.getElementById("sidebar");

/* =====================
PLYR INIT
===================== */
plyr=new Plyr(video,{
controls:['play','progress','current-time','mute','volume','settings','fullscreen']
});

/* =====================
SIDEBAR
===================== */
function toggleSidebar(){
sidebar.classList.toggle("show");
}

let favorites=
JSON.parse(localStorage.getItem("favorites")||"[]");

/* =====================
LOGO ENGINE
===================== */
const DEFAULT_LOGO=
"https://cdn-icons-png.flaticon.com/512/727/727245.png";

function safeLogo(url){
if(!url) return null;
return url.replace(/^http:\/\//,'https://');
}

function createLogo(ch){
const wrap=document.createElement("div");
wrap.className="logoWrap";

const ph=document.createElement("div");
ph.className="logoPlaceholder";
wrap.appendChild(ph);

const img=document.createElement("img");
img.className="logo";

let src=
localStorage.getItem("logo_"+ch.name) ||
safeLogo(ch.logo) ||
DEFAULT_LOGO;

img.src=src;

img.onload=()=>{
img.classList.add("loaded");
ph.remove();
localStorage.setItem("logo_"+ch.name,src);
};

img.onerror=()=>{
img.src=DEFAULT_LOGO;
img.classList.add("loaded");
ph.remove();
};

wrap.appendChild(img);
return wrap;
}

/* =====================
RENDER SIDEBAR
===================== */
function renderSidebar(list=channels){

const box=document.getElementById("channelList");
box.innerHTML="";

list.forEach(ch=>{

const div=document.createElement("div");
div.className="channel";

div.appendChild(createLogo(ch));

const name=document.createElement("span");
name.textContent=ch.name;
div.appendChild(name);

const star=document.createElement("div");
star.className="star";
star.textContent=favorites.includes(ch.url)?"⭐":"☆";
div.appendChild(star);

div.onclick=()=>{
switchChannel(ch);
sidebar.classList.remove("show");
};

star.onclick=(e)=>{
e.stopPropagation();
favorites.includes(ch.url)
? favorites=favorites.filter(f=>f!==ch.url)
: favorites.push(ch.url);
localStorage.setItem("favorites",JSON.stringify(favorites));
renderSidebar(list);
};

box.appendChild(div);
});
}

search.oninput=e=>{
const q=e.target.value.toLowerCase();
renderSidebar(channels.filter(c=>c.name.toLowerCase().includes(q)));
};

/* =====================
DRM HELPERS
===================== */
const norm=s=>s.replace(/-/g,'').toLowerCase();
function b64hex(b){
const r=atob(b);let h="";
for(let i=0;i<r.length;i++)
h+=r.charCodeAt(i).toString(16).padStart(2,'0');
return h;
}
function parseClearKeyJSON(j){
try{
const d=JSON.parse(j);
return{kid:norm(b64hex(d.keys[0].kid)),key:norm(b64hex(d.keys[0].k))};
}catch{return null;}
}

/* =====================
PLAYERS
===================== */
async function initShaka(){
if(!shaka.Player.isBrowserSupported())return;
shakaPlayer=new shaka.Player(video);
shakaPlayer.addEventListener("error",()=>recover());
}

async function destroyPlayers(){
try{if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null;}}catch{}
try{if(hls){hls.destroy();hls=null;}}catch{}
video.removeAttribute("src");
video.load();
}

/* =====================
SMART SWITCH
===================== */
async function switchChannel(ch){
if(switching) return;
switching=true;
currentChannel=ch;
await destroyPlayers();

try{
if(ch.url.includes(".mpd")){
await initShaka();
if(ch.kid && ch.key){
await shakaPlayer.configure({
drm:{clearKeys:{[ch.kid]:ch.key}}
});
}
await shakaPlayer.load(ch.url);
plyr.play();
switching=false;return;
}

if(ch.url.includes(".m3u8")){
if(Hls.isSupported()){
hls=new Hls({lowLatencyMode:true});
hls.loadSource(ch.url);
hls.attachMedia(video);
hls.on(Hls.Events.ERROR,()=>recover());
}else video.src=ch.url;
plyr.play();
switching=false;return;
}

video.src=ch.url;
plyr.play();

}catch{recover();}
switching=false;
}

/* =====================
RECOVERY
===================== */
function recover(){
if(!currentChannel)return;
setTimeout(()=>switchChannel(currentChannel),3000);
}

window.addEventListener("offline",()=>plyr.pause());
window.addEventListener("online",()=>recover());

/* =====================
M3U PARSER + KODIPROP
===================== */
function parseM3U(data){
const lines=data.split("\n");
let ch={},out=[];
for(let l of lines){
l=l.trim();
if(l.startsWith("#EXTINF")){
ch={};
ch.name=l.split(",").pop();
const m=l.match(/tvg-logo="([^"]+)"|logo="([^"]+)"/);
if(m) ch.logo=m[1]||m[2];
}
else if(l.includes("license_key=")){
let d=l.split("license_key=")[1].trim();
if(d.startsWith("{")){
const p=parseClearKeyJSON(d);
if(p){ch.kid=p.kid;ch.key=p.key;}
}else if(d.includes(":")){
let[kid,key]=d.split(":");
ch.kid=norm(kid);ch.key=norm(key);
}
}
else if(l.startsWith("http")){
ch.url=l;
out.push(ch);
ch={};
}
}
return out;
}

/* =====================
LOAD PLAYLIST
===================== */
fetch("https://raw.githubusercontent.com/dovietsy/acestreamfb/refs/heads/main/acestreamfb.txt")
.then(r=>r.text())
.then(t=>{
channels=parseM3U(t);
renderSidebar();
if(channels.length) switchChannel(channels[0]);
});
</script>
</body>
</html>
