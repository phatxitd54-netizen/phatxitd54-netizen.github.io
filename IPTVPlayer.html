<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPTV Hybrid Player</title>

<!-- JWPlayer -->
<script src="https://ssl.p.jwpcdn.com/player/v/8.8.2/jwplayer.js"></script>
<script>
jwplayer.key="W7zSm81+mmIsg7F+fyHRKhF3ggLkTqtGMhvI92kbqf/ysE99";
</script>

<!-- Shaka -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<style>
html,body{margin:0;height:100%;background:black;font-family:sans-serif;overflow:hidden}

#jw,#shaka{width:100%;height:100%;display:none}
video{width:100%;height:100%;background:black}

.sidebar{
position:absolute;left:0;top:0;height:100%;
width:clamp(320px,32vw,480px);
background:rgba(20,20,20,.97);
color:white;z-index:999;
transform:translateX(-100%);
transition:.25s;display:flex;flex-direction:column
}
.sidebar.show{transform:translateX(0)}

.menuBtn{
position:absolute;top:20px;left:20px;z-index:1000;
background:rgba(0,0,0,.6);color:white;
border:none;padding:10px 14px;border-radius:10px;cursor:pointer
}

.searchBox{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.search{width:100%;padding:10px;border-radius:10px;border:none}

.groupSelect{
margin-top:8px;width:100%;padding:8px;border-radius:8px
}

.channelList{flex:1;overflow-y:auto;padding:10px}

.channel{
display:flex;gap:10px;align-items:center;
padding:10px;border-radius:12px;cursor:pointer
}
.channel:hover{background:#2563eb}

.logo{width:40px;height:40px;object-fit:contain}

.epg{font-size:12px;opacity:.8}
</style>
</head>

<body>

<div id="jw"></div>

<div id="shaka">
  <video id="video" controls autoplay></video>
</div>

<button class="menuBtn" onclick="toggleSidebar()">☰</button>

<div id="sidebar" class="sidebar">
  <div class="searchBox">
    <input id="search" class="search" placeholder="Search channel">
    <select id="group" class="groupSelect"></select>
  </div>
  <div id="channelList" class="channelList"></div>
</div>

<script>
/* =========================
GLOBAL
========================= */
let channels=[],epgData={},current=null;
const sidebar=document.getElementById("sidebar");
const jw=jwplayer("jw");
const video=document.getElementById("video");
let shakaPlayer;

/* =========================
INIT
========================= */
jw.setup({width:"100%",height:"100%",autostart:true});

async function initShaka(){
  shakaPlayer=new shaka.Player(video);
}

/* =========================
UI
========================= */
function toggleSidebar(){sidebar.classList.toggle("show")}

/* =========================
EPG
========================= */
async function loadEPG(){
  const xml=new DOMParser().parseFromString(
    await fetch("https://vnepg.site/epg.xml").then(r=>r.text()),
    "text/xml"
  );
  xml.querySelectorAll("programme").forEach(p=>{
    const ch=p.getAttribute("channel");
    if(!epgData[ch]) epgData[ch]=[];
    epgData[ch].push({
      title:p.querySelector("title")?.textContent||""
    });
  });
}
const nowEPG=id=>epgData[id]?.[0]?.title||"";

/* =========================
RENDER
========================= */
function render(list){
  const box=document.getElementById("channelList");
  box.innerHTML="";
  list.forEach(c=>{
    const d=document.createElement("div");
    d.className="channel";
    d.innerHTML=`
      <img class="logo" src="${c.logo||''}">
      <div>
        <b>${c.name}</b>
        <div class="epg">${nowEPG(c.tvg)}</div>
      </div>`;
    d.onclick=()=>play(c);
    box.appendChild(d);
  });
}

function renderGroups(){
  const g=document.getElementById("group");
  g.innerHTML="<option value=''>All groups</option>";
  [...new Set(channels.map(c=>c.group).filter(Boolean))]
    .forEach(gr=>{
      g.innerHTML+=`<option>${gr}</option>`;
    });
}

document.getElementById("search").oninput=e=>{
  filter();
};
document.getElementById("group").onchange=filter;

function filter(){
  const q=search.value.toLowerCase();
  const g=group.value;
  render(channels.filter(c=>
    c.name.toLowerCase().includes(q) &&
    (!g || c.group===g)
  ));
}

/* =========================
PLAYER SWITCH
========================= */
async function play(ch){
  current=ch;
  sidebar.classList.remove("show");

  jw.stop();
  jw.getContainer().style.display="none";
  document.getElementById("shaka").style.display="none";

  // DASH + DRM → SHAKA
  if(ch.url.includes(".mpd") && ch.kid){
    document.getElementById("shaka").style.display="block";
    if(!shakaPlayer) await initShaka();
    await shakaPlayer.configure({
      drm:{clearKeys:{[ch.kid]:ch.key}}
    });
    await shakaPlayer.load(ch.url);
    video.play();
    return;
  }

  // HLS / NON DRM → JW
  jw.getContainer().style.display="block";
  jw.load([{file:ch.url}]);
  jw.play();
}

/* =========================
M3U PARSER
========================= */
function parseM3U(txt){
  const l=txt.split("\n");
  let c={},out=[];
  for(let line of l){
    line=line.trim();
    if(line.startsWith("#EXTINF")){
      c={};
      c.name=line.split(",").pop();
      c.logo=line.match(/tvg-logo="([^"]+)"/)?.[1];
      c.tvg=line.match(/tvg-id="([^"]+)"/)?.[1];
      c.group=line.match(/group-title="([^"]+)"/)?.[1];
    }
    else if(line.includes("license_key=")){
      const [kid,key]=line.split("license_key=")[1].split(":");
      c.kid=kid?.replace(/-/g,"");
      c.key=key?.replace(/-/g,"");
    }
    else if(line.startsWith("http")){
      c.url=line;
      out.push(c);
    }
  }
  return out;
}

/* =========================
BOOT
========================= */
(async()=>{
  await loadEPG();
  const m3u=await fetch(
    "https://raw.githubusercontent.com/huh03482-dotcom/lol/refs/heads/main/playlist_clearkey_json_inline.m3u"
  ).then(r=>r.text());
  channels=parseM3U(m3u);
  renderGroups();
  render(channels);
  play(channels[0]);
})();
</script>

</body>
</html>
